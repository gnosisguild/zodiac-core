name: Version release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
      - run: yarn build
      - run: yarn coverage

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@gnosis-guild"
      - run: yarn
      - run: yarn build
      - name: Publish to npm
        run: |
          # If the release is marked as latest on GitHub, omit the npm tag and
          # let npm default to latest. Otherwise publish under the major version
          # line, for example v-3.
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"

          if [ "$GITHUB_REF_NAME" = "$latest_tag" ]; then
            npm publish --access public --non-interactive
          else
            major="$(echo "$GITHUB_REF_NAME" | sed -E 's/^v?([0-9]+).*/\1/')"
            npm publish --access public --tag "v-${major}" --non-interactive
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_AUTH_TOKEN: ${{secrets.PUBLISH_NPM_TOKEN}}
          NODE_AUTH_TOKEN: ${{secrets.PUBLISH_NPM_TOKEN}}
